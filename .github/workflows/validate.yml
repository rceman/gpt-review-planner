name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Shell syntax
        run: |
          bash -n setup.sh update.sh scripts/*.sh
          python scripts/gpt-patch-pack-runner-v1.py --help >/dev/null
          python scripts/build-gpt-patch-pack-v1.py --help >/dev/null
      - name: Version consistency
        run: python scripts/release.py check
      - name: Python compile
        run: python -m compileall -q scripts tests examples
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: GPT Patch Pack v1 self-test
        run: python scripts/selftest-gpt-patch-pack-v1.py
      - name: Example oracle tests
        run: python -m unittest discover -s examples/rust-domain-feature/reference/python -v
      - name: Fast rustc bootstrap reuse
        run: bash scripts/bootstrap-rustc.sh -- rustc --version
      - name: Example Rust kernel
        run: |
          bash scripts/bootstrap-rustc.sh -- bash -c '
            rustc --edition=2021 --test               examples/rust-domain-feature/overlay/src/damage_kernel.rs               -o /tmp/damage-kernel-tests
            /tmp/damage-kernel-tests
          '
